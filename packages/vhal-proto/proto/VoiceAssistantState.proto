syntax = "proto3";
package velan;

// ---------------------------------------------------------------------------
// VoiceAssistantState — valid values for the VOICE_ASSIST_STATE VHAL property
// (vendor property ID 0x21400002).
//
// Any ECU that reads or writes VOICE_ASSIST_STATE should import this file to
// interpret the INT32 value rather than hard-coding the integer constants.
//
// Vendor VHAL property IDs in this group:
//   0x21400001  VOICE_ASSIST_TRIGGER    INT32   IVI writes 1 to start a session
//   0x21400002  VOICE_ASSIST_STATE      INT32   see VoiceAssistantState below
//   0x21400003  VOICE_ASSIST_TRANSCRIPT STRING  audio ECU writes after STT
//   0x21400004  VOICE_ASSIST_RESPONSE   STRING  ADAS writes after LLM reply
// ---------------------------------------------------------------------------
enum VoiceAssistantState {
    IDLE      = 0;   // no active session — display hidden / motionless
    LISTENING = 1;   // wake-word detector active — waiting for wake phrase
    RECORDING = 2;   // mic open, user is speaking their request
    THINKING  = 3;   // LLM query in flight
    TALKING   = 4;   // TTS playing — assistant is speaking
}
